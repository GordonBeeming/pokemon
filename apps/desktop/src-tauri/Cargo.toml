[package]
name = "pokedex-desktop"
version = "0.1.0"
description = "Private Pokédex scanning and art synchronization companion"
authors = ["Gordon Beeming"]
edition = "2021"
rust-version = "1.85"

[package.metadata.pokedex]
supported-targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
audit-command = "pnpm --dir apps/desktop audit:macos"

[lib]
name = "pokedex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
async-trait = "=0.1.89"
axum = { version = "=0.8.9", features = ["json", "tokio"] }
base64 = "=0.22.1"
futures-util = "=0.3.31"
hex = "=0.4.3"
keyring = { version = "=3.6.3", features = ["apple-native"] }
percent-encoding = "=2.3.2"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tauri = { version = "=2.11.2", features = ["protocol-asset"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.16", features = ["io"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["fmt", "json"] }
time = { version = "=0.3.55", features = ["macros", "parsing"] }
url = "=2.5.7"
uuid = { version = "=1.23.2", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
